[package]
name = "sensai-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Text in, answers out: generation and tagging over a loaded model"

[features]
default = []
cuda = ["sensai-engine/cuda"]
rocm = ["sensai-engine/rocm"]

[dependencies]
sensai-bundle = { workspace = true }
sensai-engine = { workspace = true }

[dev-dependencies]
sensai-checkpoint = { workspace = true }
sensai-frontend-settings = { workspace = true }
serde_json = "1"
sensai-testkit = { workspace = true }

[package]
name = "tessera-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Measures a recipe's model: batch speed, and parity with a reference"

[[bin]]
name = "tessera-eval"
path = "src/main.rs"

[features]
default = []
cuda = ["tessera-engine/cuda"]
rocm = ["tessera-engine/rocm"]

[dependencies]
tessera-engine = { workspace = true }
tessera-bundle = { workspace = true }
tessera-checkpoint = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tessera-tasks = { workspace = true }
tessera-frontend-settings = { workspace = true }

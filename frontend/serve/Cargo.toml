[package]
name = "serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI-shaped HTTP routes over generation, chat and embedding"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tessera-serve"
path = "src/main.rs"

[features]
default = []
cuda = ["engine/cuda", "tasks/cuda"]
rocm = ["engine/rocm", "tasks/rocm"]

[dependencies]
axum = "0.8"
engine = { workspace = true }
bundle = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frontend-settings = { workspace = true }
tasks = { workspace = true }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

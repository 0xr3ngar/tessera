[package]
name = "serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI-shaped HTTP routes over generation, chat and embedding"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tessera-serve"
path = "src/main.rs"

[features]
default = []
cuda = ["engine/cuda", "tasks/cuda"]
rocm = ["engine/rocm", "tasks/rocm"]

[dependencies]
engine = { workspace = true }
bundle = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frontend-settings = { workspace = true }
httparse = "1"
tasks = { workspace = true }

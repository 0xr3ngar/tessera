[package]
name = "ranks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs one rank of a sharded Qwen3 forward pass, joined to the others over TCP"

[[bin]]
name = "tessera-ranks"
path = "src/main.rs"

[features]
default = []
cuda = ["run/cuda"]
rocm = ["run/rocm"]

[dependencies]
bundle = { workspace = true }
checkpoint = { workspace = true }
engine-comm = { workspace = true }
frontend-comm = { workspace = true }
frontend-settings = { workspace = true }
graph = { workspace = true }
interp = { workspace = true }
rules = { workspace = true }
lower = { workspace = true }
models = { workspace = true }
run = { workspace = true }
sim = { workspace = true }
testkit = { workspace = true }
trace = { workspace = true }

[package]
name = "inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Draws a model's graph, its lowering per rank, and tokens moving through the ranks"

[[bin]]
name = "tessera-inspect"
path = "src/main.rs"

[dependencies]
graph = { workspace = true }
lower = { workspace = true }
models = { workspace = true }
platform = { workspace = true }
rules = { workspace = true }
sim = { workspace = true }
trace = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

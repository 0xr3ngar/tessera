[package]
name = "emit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust source for kernel bodies, run in lockstep on the host"

[dependencies]
codegen = { workspace = true }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

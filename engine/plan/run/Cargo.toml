[package]
name = "sensai-run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs lowered plans on the host, Metal, CUDA or ROCm"

[features]
default = []
# The runtime loads when a plan first runs, as in gpukit.
cuda = ["sensai-gpukit/cuda"]
rocm = ["sensai-gpukit/rocm"]

[dependencies]
sensai-codegen = { workspace = true }
sensai-host = { workspace = true }
sensai-engine-comm = { workspace = true }
sensai-engine-settings = { workspace = true }
sensai-gpukit = { workspace = true }
sensai-graph = { workspace = true }
sensai-jit = { workspace = true }
sensai-lower = { workspace = true }
sensai-mem = { workspace = true }
rayon = "1"
thiserror = "2"

[dev-dependencies]
sensai-interp = { workspace = true }
serde_json = "1"
sensai-sim = { workspace = true }
sensai-testkit = { workspace = true }
sensai-trace = { workspace = true }

[package]
name = "run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs lowered plans on the host, Metal, CUDA or ROCm"

[features]
default = []
# The runtime loads when a plan first runs, as in gpukit.
cuda = ["gpukit/cuda"]
rocm = ["gpukit/rocm"]

[dependencies]
codegen = { workspace = true }
host = { workspace = true }
engine-comm = { workspace = true }
engine-settings = { workspace = true }
gpukit = { workspace = true }
graph = { workspace = true }
jit = { workspace = true }
lower = { workspace = true }
mem = { workspace = true }
rayon = "1"
thiserror = "2"

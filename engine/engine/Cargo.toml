[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Graphs on runners: a decode loop over a stepper, or one launch of a forward graph"

[features]
default = []
cuda = ["run/cuda"]
rocm = ["run/rocm"]

[dependencies]
codegen = { workspace = true }
cpu = { workspace = true }
engine-comm = { workspace = true }
engine-settings = { workspace = true }
graph = { workspace = true }
interp = { workspace = true }
kernels = { workspace = true }
linear = { workspace = true }
lower = { workspace = true }
models = { workspace = true }
run = { workspace = true }
serde = { version = "1", features = ["derive"] }
trace = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }

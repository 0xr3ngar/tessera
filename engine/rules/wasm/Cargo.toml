[package]
name = "tessera-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lowering rules a sandboxed wasm module proposes, over JSON"

[dependencies]
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-guest = { workspace = true }
tessera-lower = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
wasmi = "0.51"

[dev-dependencies]
tessera-interp = { workspace = true }
tessera-kernels = { workspace = true }
tessera-linear = { workspace = true }
tessera-run = { workspace = true }
tessera-testkit = { workspace = true }
tessera-trace = { workspace = true }
wat = "1"

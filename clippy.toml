# The process environment is read in one place: frontend_settings::read.
disallowed-methods = [
    { path = "std::env::var", reason = "read it in frontend_settings::read" },
    { path = "std::env::var_os", reason = "read it in frontend_settings::read" },
    { path = "std::env::vars", reason = "read it in frontend_settings::read" },
    { path = "std::env::vars_os", reason = "read it in frontend_settings::read" },
    { path = "std::env::home_dir", reason = "read it in frontend_settings::read" },
    { path = "std::env::temp_dir", reason = "read it in frontend_settings::read" },
]
